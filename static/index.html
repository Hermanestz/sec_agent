<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全分析前端</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            color: #fff;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            font-weight: 300;
        }

        h2 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 1.4rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            padding: 30px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.15);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #555;
            font-size: 0.9rem;
        }

        input[type="text"],
        input[type="password"],
        textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            background: #fafbfc;
        }

        input[type="text"]:focus,
        input[type="password"]:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            background: #fff;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
            font-family: 'Consolas', 'Monaco', monospace;
            background: #f8f9fa;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            margin-top: 15px;
            font-weight: 600;
            text-align: center;
            padding: 10px;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .result {
            background: #2c3e50;
            color: #f8f8f2;
            padding: 20px;
            border-radius: 8px;
            white-space: pre-wrap;
            word-wrap: break-word;
            margin-top: 15px;
            min-height: 60px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
            line-height: 1.4;
            border-left: 4px solid #667eea;
            position: relative;
            overflow-x: auto;
        }

        .result:empty::before {
            content: "结果将在这里显示...";
            color: #95a5a6;
            font-style: italic;
        }

        .hidden {
            display: none;
        }

        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }

        .radio-group label {
            display: flex;
            align-items: center;
            font-weight: normal;
            cursor: pointer;
            padding: 8px 16px;
            border: 2px solid #e1e8ed;
            border-radius: 6px;
            transition: all 0.3s ease;
            background: #fafbfc;
        }

        .radio-group input[type="radio"] {
            width: auto;
            margin-right: 8px;
        }

        .radio-group label:hover {
            border-color: #667eea;
            background: #f0f3ff;
        }

        .radio-group input[type="radio"]:checked + label,
        .radio-group label:has(input[type="radio"]:checked) {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }

        .token-display {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 6px;
            padding: 15px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 12px;
            word-break: break-all;
            max-height: 100px;
            overflow-y: auto;
        }

        .icon {
            width: 20px;
            height: 20px;
            display: inline-block;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .container {
                padding: 0 10px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .card {
                padding: 20px;
            }
            
            .radio-group {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔒 安全分析平台</h1>

        <div id="login-section" class="card fade-in">
            <h2>
                <span class="icon">🔐</span>
                用户登录
            </h2>
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" placeholder="请输入用户名" autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password">
            </div>
            <button id="login-btn">登录</button>
            <div id="login-status" class="status"></div>
        </div>

        <div id="main-app" class="hidden">
            <div class="card fade-in">
                <h2>
                    <span class="icon">🎫</span>
                    访问令牌
                </h2>
                <div id="token-display" class="token-display"></div>
            </div>
            
            <div class="card fade-in">
                <h2>
                    <span class="icon">👤</span>
                    用户信息
                </h2>
                <button id="profile-btn">获取我的信息</button>
                <pre id="profile-result" class="result"></pre>
            </div>

            <div class="card fade-in">
                <h2>
                    <span class="icon">🔍</span>
                    安全分析
                </h2>
                <div class="form-group">
                    <label for="target-input">分析目标</label>
                    <input type="text" id="target-input" placeholder="请输入域名或IP地址，例如：example.com 或 192.168.1.1">
                </div>
                <div class="form-group">
                    <label>分析类型</label>
                    <div class="radio-group">
                        <label>
                            <input type="radio" name="analysis-type" value="domain" checked>
                            🌐 域名分析
                        </label>
                        <label>
                            <input type="radio" name="analysis-type" value="ip">
                            📍 IP地址分析
                        </label>
                    </div>
                </div>
                <button id="analyze-btn">开始分析</button>
                <pre id="analysis-result" class="result"></pre>
            </div>
        </div>
    </div>

    <script>
        // API服务器的地址
        const API_BASE_URL = '';

        // 用于存储从服务器获取的访问令牌
        let accessToken = null;

        // 获取页面上的所有元素
        const loginSection = document.getElementById('login-section');
        const mainAppSection = document.getElementById('main-app');

        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('login-btn');
        const loginStatus = document.getElementById('login-status');

        const tokenDisplay = document.getElementById('token-display');
        const profileBtn = document.getElementById('profile-btn');
        const profileResult = document.getElementById('profile-result');

        const targetInput = document.getElementById('target-input');
        const analyzeBtn = document.getElementById('analyze-btn');
        const analysisResult = document.getElementById('analysis-result');

        // 显示状态消息的辅助函数
        function showStatus(element, message, type = 'info') {
            element.textContent = message;
            element.className = `status ${type}`;
            element.style.display = 'block';
        }

        // 显示加载状态
        function showLoading(button, text = '处理中...') {
            button.innerHTML = `<span class="loading"></span>${text}`;
            button.disabled = true;
        }

        // 恢复按钮状态
        function resetButton(button, text) {
            button.innerHTML = text;
            button.disabled = false;
        }

        // 登录按钮的点击事件
        loginBtn.addEventListener('click', async () => {
            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            if (!username || !password) {
                showStatus(loginStatus, '请输入用户名和密码！', 'error');
                return;
            }

            showLoading(loginBtn, '登录中...');
            showStatus(loginStatus, '正在验证用户信息...', 'info');

            // FastAPI的OAuth2PasswordRequestForm需要x-www-form-urlencoded格式的数据
            const formData = new URLSearchParams();
            formData.append('username', username);
            formData.append('password', password);

            try {
                const response = await fetch(`${API_BASE_URL}/token`, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || '登录失败');
                }

                // 登录成功
                accessToken = data.access_token;
                showStatus(loginStatus, '登录成功！正在跳转...', 'success');
                
                // 显示主应用界面
                tokenDisplay.textContent = `Bearer ${accessToken}`;
                
                setTimeout(() => {
                    loginSection.classList.add('hidden');
                    mainAppSection.classList.remove('hidden');
                }, 1000);

            } catch (error) {
                showStatus(loginStatus, `登录失败: ${error.message}`, 'error');
            } finally {
                resetButton(loginBtn, '登录');
            }
        });

        // 回车键登录
        [usernameInput, passwordInput].forEach(input => {
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    loginBtn.click();
                }
            });
        });

        // 获取用户信息按钮的点击事件
        profileBtn.addEventListener('click', async () => {
            if (!accessToken) {
                profileResult.textContent = '请先登录！';
                return;
            }
            
            showLoading(profileBtn, '获取中...');
            profileResult.textContent = '正在获取用户信息...';

            try {
                const response = await fetch(`${API_BASE_URL}/users/me`, {
                    headers: {
                        'Authorization': `Bearer ${accessToken}`
                    }
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.detail);
                
                // 格式化JSON并显示
                profileResult.textContent = JSON.stringify(data, null, 2);

            } catch (error) {
                profileResult.textContent = `获取失败: ${error.message}`;
            } finally {
                resetButton(profileBtn, '获取我的信息');
            }
        });

        // 开始分析按钮的点击事件
        analyzeBtn.addEventListener('click', async () => {
            if (!accessToken) {
                analysisResult.textContent = '请先登录！';
                return;
            }

            const target = targetInput.value.trim();
            if (!target) {
                analysisResult.textContent = '请输入要分析的目标！';
                targetInput.focus();
                return;
            }
            
            showLoading(analyzeBtn, '分析中...');
            analysisResult.textContent = '正在进行安全分析，请稍候...';

            const analysisType = document.querySelector('input[name="analysis-type"]:checked').value;
            const endpoint = analysisType === 'domain' ? '/analyze/domain' : '/analyze/ip';

            try {
                const response = await fetch(`${API_BASE_URL}${endpoint}`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${accessToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ target: target })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.detail);

                analysisResult.textContent = JSON.stringify(data, null, 2);

            } catch (error) {
                analysisResult.textContent = `分析失败: ${error.message}`;
            } finally {
                resetButton(analyzeBtn, '开始分析');
            }
        });

        // 回车键分析
        targetInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                analyzeBtn.click();
            }
        });
    </script>
</body>
</html>
